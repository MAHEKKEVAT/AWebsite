<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Elegant Login</title>
<!-- Google Fonts for style -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap" rel="stylesheet" />

<style>
  /* Your existing styles (unchanged) */
body {
  margin: 0;
  font-family: 'Montserrat', sans-serif;
  height: 100vh;
  background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
@keyframes floatBg {
  0% { background-position: 0 50%; }
  100% { background-position: 50% 50%; }
}
body {
  background-size: 200% 200%;
  animation: floatBg 30s ease infinite;
}
/* Card styles, headings, form, buttons, etc. (unchanged) - omit here for brevity */
.card {
  background: rgba(255,255,255,0.9);
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.1);
  max-width: 400px;
  width: 100%;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(10px);
  animation: slideIn 1s ease-out;
}
@keyframes slideIn {
  from { transform: translateY(50px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
h2 {
  text-align: center;
  margin-bottom: 10px;
  font-size: 2em;
  color: #222;
}
h2 span {
  color: #ff4b2b;
}
p {
  text-align: center;
  font-size: 1em;
  color: #555;
  margin-bottom: 30px;
}
.form-group {
  position: relative;
  margin-bottom: 25px;
}
input {
  width: 100%;
  padding: 20px 10px 10px 10px;
  border: none;
  border-bottom: 2px solid #ccc;
  background: transparent;
  font-size: 1em;
  outline: none;
  transition: border-color 0.3s;
}
input:focus {
  border-color: #ff4b2b;
}
input::placeholder {
  color: transparent;
}
label {
  position: absolute;
  top: 20px;
  left: 10px;
  font-size: 1em;
  color: #999;
  pointer-events: none;
  transition: all 0.2s ease;
  background: transparent;
}
input:focus + label,
input:not(:placeholder-shown) + label {
  top: -10px;
  font-size: 0.8em;
  color: #ff4b2b;
}
.icon {
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  fill: #bbb;
  transition: fill 0.3s;
}
input:focus ~ .icon {
  fill: #ff4b2b;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg, #ff4b2b, #ff416c);
  color: #fff;
  font-size: 1.1em;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(255,75,43,0.2);
  transition: all 0.3s ease;
}
button:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 25px rgba(255,75,43,0.3);
}
.register-btn {
  background: none;
  border: 2px solid #ff4b2b;
  color: #ff4b2b;
  margin-top: 20px;
  padding: 12px 30px;
  border-radius: 50px;
  font-weight: 600;
  font-size: 1em;
  cursor: pointer;
  transition: all 0.3s;
}
.register-btn:hover {
  background-color: #ff4b2b;
  color: #fff;
}
.create-link {
  display: block;
  text-align: center;
  margin-top: 25px;
  font-size: 0.9em;
  color: #555;
  cursor: pointer;
  text-decoration: underline;
  transition: color 0.2s;
}
.create-link:hover {
  color: #ff4b2b;
}
.notification {
  position: fixed;
  top: -100px;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: #fff;
  padding: 15px 25px;
  border-radius: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  font-size: 1em;
  z-index: 999;
  transition: top 0.5s ease, opacity 0.3s ease;
}
.notification.show {
  top: 30px;
  opacity: 1;
}
</style>
</head>
<body>

<div class="card">
  <h2>Welcome to <span>MyWebsite</span></h2>
  <p>Secure login to access your dashboard</p>

  <form id="loginForm" autocomplete="off">
    <!-- Email -->
    <div class="form-group">
      <input type="email" id="email" placeholder="Your Email" required />
      <label for="email">Email</label>
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M4 4h16v16H4V4zm0-2a2 2 0 0 0-2 2v20l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H4z" />
      </svg>
    </div>
    <!-- Password -->
    <div class="form-group">
      <input type="password" id="password" placeholder="Your Password" required />
      <label for="password">Password</label>
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M19,21H5V9h14V21z M6,20h12V10H6V20z M16.5,10h-1V7c0-1.9-1.6-3.5-3.5-3.5S8.5,5.1,8.5,7v3h-1V7c0-2.5,2-4.5,4.5-4.5S16.5,4.5,16.5,7V10z"/>
      </svg>
    </div>
    <!-- Submit Button -->
    <button type="submit">Login</button>
    <button type="button" class="register-btn" id="registerBtn">Register</button>
    <div class="create-link" style="margin-top:15px; display:block;">View Basic Version</div>
  </form>
  <div class="notification" id="notif"></div>
</div>

<script type="module">
  // Firebase SDK imports
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyCsoet2YlQuE_VCn38JxSLEVTqPcJVoULk",
    authDomain: "mywebsite-3f0a8.firebaseapp.com",
    projectId: "mywebsite-3f0a8",
    storageBucket: "mywebsite-3f0a8.appspot.com",
    messagingSenderId: "683900610906",
    appId: "1:683900610906:web:b4364a57332989b8166b63",
    measurementId: "G-PTTN3M405E"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const form = document.getElementById('loginForm');
  const notif = document.getElementById('notif');
  const registerBtn = document.getElementById('registerBtn');

  function showNotification(msg, isSuccess) {
    notif.innerText = msg;
    notif.style.backgroundColor = isSuccess ? '#4CAF50' : '#f44336';
    notif.classList.add('show');
    setTimeout(() => notif.classList.remove('show'), 3000);
  }

  // Redirect on login success
  onAuthStateChanged(auth, user => {
    if (user) {
      // User logged in, redirect to HomePage.html
      window.location.href = 'HomePage.html';
    }
  });

  // Register button (you can implement registration page or toggle here)
  document.getElementById('registerBtn').onclick = () => {
    alert('Registration page not implemented here. Please create a registration page.');
  };

  // Handle login form submission
  form.onsubmit = async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      showNotification('Logging in...', true);
      // After login, onAuthStateChanged will redirect
    } catch (err) {
      showNotification('Login failed: ' + err.message, false);
    }
  };
</script>

</body>
</html>
