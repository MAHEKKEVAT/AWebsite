<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Details</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <style>
    body {
      background: #f9f9f9;
      font-family: 'Poppins', sans-serif;
      padding: 40px;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
    }
    h2 {
      margin-bottom: 20px;
      text-align: center;
    }
    .app-logo-container {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 20px;
    }
    .app-logo {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .app-detail {
      margin-bottom: 15px;
    }
    .back-button {
      display: inline-block;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      margin-top: 20px;
    }
    .back-button:hover {
      background: #0056b3;
    }

    .download-btn {
      display: inline-block;
      padding: 10px 20px;
      background: #ff4b2b;
      color: white;
      text-decoration: none;
      border-radius: 50px;
      margin-top: 15px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .download-btn i {
      font-size: 1.2rem;
    }

    .download-btn:hover {
      background: #ff3c1d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="appName">Loading...</h2>
    <div class="app-logo-container">
      <img id="appLogo" src="" alt="App Logo" class="app-logo" />
    </div>
    <div class="app-detail"><strong>Description:</strong> <span id="appDescription">N/A</span></div>
    <div class="app-detail"><strong>Version:</strong> <span id="appVersion">N/A</span></div>
    <div class="app-detail"><strong>Category:</strong> <span id="appCategory">N/A</span></div>
    
    <!-- Download Button -->
    <a href="#" id="downloadLink" class="download-btn" style="display:none;">
      <i class="fas fa-download"></i> Download App
    </a>

    <a href="HomePage.html" class="back-button">← Back</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const appId = urlParams.get('appId');

    if (!appId) {
      document.body.innerHTML = '<h2>No app ID provided.</h2>';
      return;
    }

    // Simulate fetching from Firestore or API
    fetch(`/api/apps/${appId}`) // Replace this with actual data source like Firebase
      .then(res => res.json())
      .then(data => {
        document.getElementById('appName').textContent = data.app_name || "Unknown App";
        document.getElementById('appLogo').src = data.app_logo || 'https://via.placeholder.com/100';
        document.getElementById('appDescription').textContent = data.description || 'No description available.';
        document.getElementById('appVersion').textContent = data.version || 'N/A';
        document.getElementById('appCategory').textContent = data.category || 'N/A';

        const downloadBtn = document.getElementById('downloadLink');
        const appLink = data.app_link;

        if (appLink) {
          downloadBtn.href = appLink;
          downloadBtn.style.display = 'inline-block';
        } else {
          downloadBtn.style.display = 'none';
        }
      })
      .catch(err => {
        console.error("Error loading app details:", err);
        document.body.innerHTML = '<h2>Error loading app details.</h2>';
      });
  </script>
</body>
</html>
